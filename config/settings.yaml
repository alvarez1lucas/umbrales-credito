# Configuración central del proyecto ciclo-credito.

paths:
  raw: data/raw              # descargas tal cual (fuera de git)
  snapshots: data/snapshots  # una foto de la cartera de Bondora por fecha de publicación (fuera de git; en Actions van como assets de releases)
  processed: data/processed  # tablas limpias en parquet que lee dbt
  warehouse: data/warehouse  # base DuckDB que construye dbt
  outputs: outputs           # resultados chicos que sí se versionan (CSV/JSON)

http:
  timeout: 300
  retries: 4
  backoff: 2
  user_agent: "ciclo-credito/0.1 (+https://github.com/alvarez1lucas)"

bondora:
  # Dataset público de préstamos: un Excel con cada crédito otorgado y su estado vigente.
  # Página: https://goandgrow.eu/en/public-statistics/
  url: https://sabanners001.blob.core.windows.net/statistics/public/loan_dataset_investor.xlsx
  dias_evento: 90  # días de atraso que definen el evento de mora (estándar 90+)
  archivadas:      # publicaciones viejas capturadas por la Wayback Machine
    - fecha: 2025-08-18
      url: https://web.archive.org/web/20250818161608id_/https://sabanners001.blob.core.windows.net/statistics/public/loan_dataset_investor.xlsx

hmda:
  # Solicitudes hipotecarias de EE.UU. (Home Mortgage Disclosure Act), API pública del FFIEC/CFPB.
  api: https://ffiec.cfpb.gov/v2/data-browser-api/view/csv
  anios: [2023, 2024, 2025]
  estados: [GA]           # Georgia: ~200 mil solicitudes de compra por año, mercado diverso
  loan_purposes: [1]      # 1 = compra de vivienda
  actions_taken: [1, 2, 3, 4, 5]  # otorgado, aprobado no aceptado, rechazado, desistido, incompleto
  columnas:
    - activity_year
    - lei
    - derived_msa-md
    - county_code
    - derived_loan_product_type
    - derived_race
    - derived_ethnicity
    - derived_sex
    - action_taken
    - loan_type
    - lien_status
    - occupancy_type
    - loan_amount
    - loan_to_value_ratio
    - interest_rate
    - rate_spread
    - loan_term
    - property_value
    - income
    - debt_to_income_ratio
    - applicant_credit_score_type
    - applicant_age
    - aus-1
    - denial_reason-1
    - denial_reason-2
    - tract_minority_population_percent
    - tract_to_msa_income_percentage

cobranzas:
  paises_principales: [Finland, Estonia, Netherlands]
  minimo_segmento: 100   # créditos mínimos para calibrar un segmento; si no, se usa el tramo
  capacidades: [0.1, 0.2, 0.3, 0.5]  # fracción de cuentas atrasadas que llega a gestionar el equipo

  # SUPUESTOS, no datos: Bondora no publica gestiones. Se rotulan como escenario en todos los resultados.
  efecto_gestion:        # proporción de los eventos que evita gestionar, por tramo: cuanto antes, más
    "1-30": 0.20
    "31-60": 0.10
    "61-90": 0.05
  incrementalidad: 0.30  # de los pagos logrados por contacto, parte que no habría ocurrido sin gestión
  canales:               # costo en euros por cuenta y tasas por cuenta gestionada
    llamada:  {costo: 1.50, contacto: 0.45, promesa: 0.50, cumplimiento: 0.60}
    whatsapp: {costo: 0.08, contacto: 0.35, promesa: 0.25, cumplimiento: 0.50}
    sms:      {costo: 0.05, contacto: 0.20, promesa: 0.15, cumplimiento: 0.50}
    mail:     {costo: 0.01, contacto: 0.10, promesa: 0.10, cumplimiento: 0.50}
