version: 2

models:
  - name: fct_prestamos
    description: Un crédito de Bondora por fila, según la foto más reciente.
    columns:
      - name: prestamo_id
        data_tests: [unique, not_null]
      - name: estado
        data_tests:
          - accepted_values:
              arguments:
                values: [activo, default, pagado, castigado]
      - name: tramo
        data_tests:
          - accepted_values:
              arguments:
                values: [al_dia, "1-30", "31-60", "61-90", "90+", pagado, castigado]
      - name: monto_otorgado
        data_tests: [not_null]
      - name: fecha_evento_90
        description: Fecha estimada en que el crédito llegó a 90 días de atraso (nula si no llegó).

  - name: mart_cosechas
    description: Curvas de cosecha de mora 90+ por trimestre de originación y meses desde el otorgamiento.
    data_tests:
      - combinacion_unica:
          columnas: [cosecha, mes]
    columns:
      - name: tasa_evento_pct
        data_tests: [not_null]

  - name: mart_cartera_tramos
    description: Cartera viva por foto, país, rating y tramo de atraso.

  - name: mart_roll_rates
    description: Transiciones entre tramos de atraso de una foto a la siguiente.
