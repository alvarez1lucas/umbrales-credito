[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciclo"
version = "0.1.0"
description = "Ciclo del crédito con datos reales: originación (HMDA), cartera y cobranzas (Bondora)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
