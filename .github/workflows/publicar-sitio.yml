name: Publicar sitio

# El sitio y el memo se generan desde outputs/ y se publican en GitHub Pages. Corre después de cada
# actualización de datos (los commits del bot no disparan workflows) y en cada push a main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar datos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # en workflow_run, incluye el commit de datos del bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Generar sitio y memo
        run: |
          python -m ciclo.sitio
          python -m ciclo.memo

      - name: Memo en PDF (Chrome headless)
        run: |
          for par in "es/memo.html:memo.pdf" "memo.html:memo-en.pdf"; do
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="site/${par#*:}" "file://$PWD/site/${par%%:*}"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
